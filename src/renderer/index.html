<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenHouse</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">OpenHouse</div>
      <button class="nav-button active" data-view="desktop">桌面</button>
      <div class="sidebar-footer">本地网页工作台</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1>桌面</h1>
        <div id="runtime-status" class="runtime-status">正在启动本地服务</div>
        <label class="container-setting" title="限制同时打开的网页容器数量">
          网页容器
          <input id="max-containers" type="number" min="1" max="12" step="1" inputmode="numeric" />
        </label>
        <button id="refresh" class="button button-quiet" title="刷新状态">刷新</button>
      </header>
      <section class="view">
        <div id="app-grid" class="app-grid"></div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
